<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecasting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Weather Forecasting System</h1>
        
        <!-- Search and Favorites -->
        <div class="search-container">
            <div class="input-group">
                <input type="text" id="cityInput" class="form-control" placeholder="Enter city name">
                <button class="btn btn-primary" onclick="getWeather()">Search</button>
            </div>
            <div class="favorites-section mt-3">
                <h4 class="text-white">Favorite Cities</h4>
                <div id="favoritesList" class="d-flex flex-wrap gap-2"></div>
            </div>
        </div>

        <!-- Current Weather -->
        <div id="currentWeather" class="weather-card" style="display: none;">
            <div class="row">
                <div class="col-md-6">
                    <div class="d-flex align-items-center justify-content-between">
                        <h2 id="cityName"></h2>
                        <button id="favoriteBtn" class="btn btn-outline-primary" onclick="toggleFavorite()">
                            <i class="fas fa-heart"></i>
                        </button>
                    </div>
                    <h3 id="temperature"></h3>
                    <p id="description"></p>
                    <div class="weather-details">
                        <div class="weather-detail-item">
                            <p id="humidity"></p>
                        </div>
                        <div class="weather-detail-item">
                            <p id="windSpeed"></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 text-center">
                    <img id="weatherIcon" class="weather-icon">
                </div>
            </div>
        </div>

        <!-- Recommendations -->
        <div id="recommendations" class="recommendations-card mt-4" style="display: none;">
            <h3>Today's Recommendations</h3>
            <div class="row">
                <div class="col-md-3">
                    <div class="recommendation-section">
                        <h4><i class="fas fa-tshirt"></i> What to Wear</h4>
                        <ul id="clothingList"></ul>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="recommendation-section">
                        <h4><i class="fas fa-umbrella"></i> Accessories</h4>
                        <ul id="accessoriesList"></ul>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="recommendation-section">
                        <h4><i class="fas fa-running"></i> Activities</h4>
                        <ul id="activitiesList"></ul>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="recommendation-section">
                        <h4><i class="fas fa-heart"></i> Health Tips</h4>
                        <ul id="healthTipsList"></ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5-Day Forecast -->
        <div id="forecast" class="mt-4" style="display: none;">
            <h3>5-Day Forecast</h3>
            <div id="forecastContainer" class="row"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
